apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aisdlc-orchestrator.fullname" . }}
  labels:
    {{- include "aisdlc-orchestrator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "aisdlc-orchestrator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aisdlc-orchestrator.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: orchestrator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
              protocol: TCP
          # Non-sensitive config from ConfigMap
          envFrom:
            - configMapRef:
                name: {{ include "aisdlc-orchestrator.fullname" . }}-config
          # Sensitive credentials from Secret
          env:
            - name: REDIS_URL
              value: {{ .Values.env.REDIS_URL | quote }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "aisdlc-orchestrator.fullname" . }}-secrets
                  key: ANTHROPIC_API_KEY
            - name: JIRA_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "aisdlc-orchestrator.fullname" . }}-secrets
                  key: JIRA_EMAIL
            - name: JIRA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "aisdlc-orchestrator.fullname" . }}-secrets
                  key: JIRA_API_TOKEN
            - name: AISDLC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "aisdlc-orchestrator.fullname" . }}-secrets
                  key: AISDLC_API_KEY
                  optional: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
